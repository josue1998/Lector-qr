<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#075E54">
<title>Escáner de números</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef2f3;color:#172026}
header{background:#075E54;color:white;padding:18px 16px;text-align:center}
h1{margin:0;font-size:24px}
main{max-width:650px;margin:auto;padding:14px}
.card{background:white;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 3px 12px #0002}
#cameraBox{position:relative;background:#111;border-radius:14px;overflow:hidden;min-height:300px}
video{width:100%;display:block;max-height:65vh;object-fit:cover}
#scanLine{position:absolute;left:8%;right:8%;top:50%;height:3px;background:#25D366;box-shadow:0 0 10px #25D366;animation:scan 1.8s infinite}
@keyframes scan{0%,100%{transform:translateY(-90px)}50%{transform:translateY(90px)}}
.status{padding:10px;text-align:center;font-size:14px}
button{border:0;border-radius:12px;padding:13px 16px;font-weight:bold;font-size:15px;cursor:pointer}
.primary{background:#075E54;color:white}.green{background:#25D366;color:#073b2a}
.gray{background:#e6eaec;color:#172026}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1;min-width:130px}
label{font-weight:bold;display:block;margin-bottom:7px}
input{width:100%;padding:12px;border:1px solid #c8d0d4;border-radius:10px;font-size:16px}
#numbers{margin:8px 0 0;padding-left:22px}
#numbers li{padding:7px 0;font-size:18px;border-bottom:1px solid #eee}
.small{font-size:13px;color:#5c686d}
.success{color:#087f45;font-weight:bold}
.warning{color:#a35b00}
</style>
</head>
<body>
<header><h1>📷 Escáner de números</h1></header>

<main>
<section class="card">
  <div id="cameraBox">
    <video id="video" autoplay muted playsinline></video>
    <div id="scanLine"></div>
  </div>
  <div id="status" class="status">Pulsa “Iniciar cámara”.</div>
  <div class="row">
    <button class="primary" id="start">Iniciar cámara</button>
    <button class="gray" id="stop">Detener</button>
  </div>
</section>

<section class="card">
  <label>Números detectados</label>
  <ol id="numbers"><li class="small">Todavía no hay números.</li></ol>
  <div class="row">
    <button class="gray" id="clear">Limpiar lista</button>
    <button class="green" id="copy">Copiar números</button>
  </div>
</section>

<section class="card">
  <label for="phone">WhatsApp (opcional)</label>
  <input id="phone" inputmode="tel" placeholder="Ej.: 50760000000">
  <p class="small">Escribe el número con código de país, sin + ni espacios. Si lo dejas vacío, WhatsApp te permitirá elegir el contacto.</p>
  <div class="row">
    <button class="green" id="whatsapp">Enviar a WhatsApp</button>
  </div>
  <p id="result" class="small"></p>
</section>
</main>

<script>
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const numbersEl = document.getElementById('numbers');
const resultEl = document.getElementById('result');
let stream = null;
let detector = null;
let timer = null;
let numbers = [];

function render(){
  numbersEl.innerHTML = '';
  if(!numbers.length){
    numbersEl.innerHTML='<li class="small">Todavía no hay números.</li>';
    return;
  }
  numbers.forEach(n=>{
    const li=document.createElement('li');
    li.textContent=n;
    numbersEl.appendChild(li);
  });
}

function addNumbers(values){
  let changed=false;
  values.forEach(v=>{
    const clean=String(v).replace(/[^0-9]/g,'');
    if(clean && !numbers.includes(clean)){
      numbers.push(clean); changed=true;
    }
  });
  if(changed){
    render();
    resultEl.textContent='Número detectado automáticamente.';
    resultEl.className='small success';
  }
}

async function startCamera(){
  try{
    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error('El navegador no permite acceso a la cámara.');
    }
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}},
      audio:false
    });
    video.srcObject=stream;
    statusEl.textContent='Cámara activa. Apunta al número, código QR o código de barras.';
    startDetection();
  }catch(e){
    statusEl.innerHTML='No se pudo abrir la cámara. Usa HTTPS o localhost y acepta el permiso.';
    console.error(e);
  }
}

function stopCamera(){
  if(timer){clearInterval(timer);timer=null;}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  video.srcObject=null;
  statusEl.textContent='Cámara detenida.';
}

function startDetection(){
  if('BarcodeDetector' in window){
    const formats=['qr_code','code_128','code_39','code_93','ean_13','ean_8','upc_a','upc_e','itf','codabar'];
    try{ detector=new BarcodeDetector({formats}); }catch(e){ detector=new BarcodeDetector(); }
    timer=setInterval(async()=>{
      if(!video.videoWidth) return;
      try{
        const codes=await detector.detect(video);
        if(codes.length) addNumbers(codes.map(c=>c.rawValue));
      }catch(e){}
    },450);
  }else{
    statusEl.innerHTML='Escáner QR/código de barras no disponible en este navegador. Puedes usar Chrome/Edge actualizado.';
  }
}

async function copyNumbers(){
  if(!numbers.length) return;
  await navigator.clipboard.writeText(numbers.join('\\n'));
  resultEl.textContent='Lista copiada.';
  resultEl.className='small success';
}

function sendWhatsApp(){
  if(!numbers.length){
    resultEl.textContent='Primero escanea al menos un número.';
    resultEl.className='small warning';
    return;
  }
  const phone=document.getElementById('phone').value.replace(/\\D/g,'');
  const message='Números escaneados:\\n' + numbers.map((n,i)=>`${i+1}. ${n}`).join('\\n');
  const url='https://wa.me/' + phone + '?text=' + encodeURIComponent(message);
  window.open(url,'_blank');
}

document.getElementById('start').onclick=startCamera;
document.getElementById('stop').onclick=stopCamera;
document.getElementById('clear').onclick=()=>{numbers=[];render();};
document.getElementById('copy').onclick=copyNumbers;
document.getElementById('whatsapp').onclick=sendWhatsApp;

window.addEventListener('beforeunload',stopCamera);
render();
</script>
</body>
</html>
